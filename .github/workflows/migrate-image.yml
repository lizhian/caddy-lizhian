name: Migrate historical image tags

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install registry copy tool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo

      - name: Authenticate with GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | skopeo login --authfile "$RUNNER_TEMP/ghcr-auth.json" --username "$GITHUB_ACTOR" --password-stdin ghcr.io

      - name: Copy and verify all historical tags
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess
          authfile = os.environ['RUNNER_TEMP'] + '/ghcr-auth.json'
          source = 'ghcr.io/lizhian/lizhian-caddy'
          target = 'ghcr.io/lizhian/caddy-lizhian'
          data = json.loads(subprocess.check_output(['skopeo', 'list-tags', '--authfile', authfile, 'docker://' + source], text=True))
          tags = sorted(data['Tags'])
          assert tags, 'Source image has no tags'
          report = []
          for tag in tags:
              assert re.fullmatch(r'[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}', tag)
              subprocess.run(['skopeo', 'copy', '--all', '--preserve-digests', '--authfile', authfile, 'docker://' + source + ':' + tag, 'docker://' + target + ':' + tag], check=True)
              def digest(image):
                  raw = subprocess.check_output(['skopeo', 'inspect', '--raw', '--authfile', authfile, 'docker://' + image + ':' + tag])
                  return 'sha256:' + hashlib.sha256(raw).hexdigest()
              original, copied = digest(source), digest(target)
              assert original == copied, 'Manifest changed during migration'
              report.append({'tag': tag, 'digest': copied})
          print('MIGRATION_REPORT=' + json.dumps(report))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'Migrated and verified **{len(report)} tags** to `{target}`.\n\n')
              summary.write('| Tag | Manifest digest |\n|---|---|\n')
              for item in report:
                  summary.write(f"| `{item['tag']}` | `{item['digest']}` |\n")
          PY
