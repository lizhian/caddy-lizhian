name: Check Caddy version and publish caddy-lizhian

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - build-info.json
      - examples/**
      - .github/update-check.json
  schedule:
    # 03:17 Asia/Shanghai, every day.
    - cron: "17 19 * * *"
  workflow_dispatch:
    inputs:
      force_build:
        description: Force a rebuild even when the Caddy version is unchanged
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: caddy-lizhian-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Test version check behavior
        run: python3 -m unittest discover -s tests -v

      - name: Check latest Caddy against the last successful publication
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          FORCE_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.force_build || false }}
        run: |
          git fetch origin main
          if git cat-file -e origin/main:build-info.json 2>/dev/null; then
            git show origin/main:build-info.json > "$RUNNER_TEMP/last-published.json"
          else
            printf '{}\n' > "$RUNNER_TEMP/last-published.json"
          fi
          args=()
          if [ "$FORCE_BUILD" = true ]; then
            args+=(--force)
          fi
          python3 scripts/resolve_versions.py --image "$IMAGE_NAME" --previous "$RUNNER_TEMP/last-published.json" --github-output "$GITHUB_OUTPUT" "${args[@]}"

      - name: Keep scheduled version checks active without rebuilding
        if: github.event_name == 'schedule'
        env:
          CADDY_VERSION: ${{ steps.versions.outputs.caddy_version }}
        run: python3 scripts/keep_schedule_active.py "$CADDY_VERSION"

      - name: Set up QEMU
        if: steps.versions.outputs.should_build == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        if: steps.versions.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: steps.versions.outputs.should_build == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, verify and publish both architectures
        if: steps.versions.outputs.should_build == 'true'
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          pull: true
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ steps.versions.outputs.major }}
            ${{ steps.image.outputs.name }}:${{ steps.versions.outputs.minor }}
            ${{ steps.image.outputs.name }}:${{ steps.versions.outputs.image_version }}
            ${{ steps.image.outputs.name }}:build-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            CADDY_BUILDER_IMAGE=caddy:${{ steps.versions.outputs.image_version }}-builder
            CADDY_RUNTIME_IMAGE=caddy:${{ steps.versions.outputs.image_version }}-alpine
            CADDY_VERSION=${{ steps.versions.outputs.caddy_version }}
            FORWARDPROXY_REF=${{ steps.versions.outputs.forwardproxy_ref }}
            CADDY_L4_REF=${{ steps.versions.outputs.caddy_l4_ref }}
            CLOUDFLARE_REF=${{ steps.versions.outputs.cloudflare_ref }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.versions.outputs.caddy_version }}
            io.lizhian.caddy.forwardproxy.revision=${{ steps.versions.outputs.forwardproxy_ref }}
            io.lizhian.caddy.l4.revision=${{ steps.versions.outputs.caddy_l4_ref }}
            io.lizhian.caddy.cloudflare.revision=${{ steps.versions.outputs.cloudflare_ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record the successful publication
        if: steps.versions.outputs.should_build == 'true'
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          CADDY_VERSION: ${{ steps.versions.outputs.caddy_version }}
        run: |
          python3 scripts/write_build_info.py build-versions.json "$RUNNER_TEMP/build-info.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          cp "$RUNNER_TEMP/build-info.json" build-info.json
          git add build-info.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: publish Caddy ${CADDY_VERSION} image"
          git push origin HEAD:main
